<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحميل تيك توك — Zak Tools</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, 'Segoe UI', 'Tahoma', sans-serif;
            background: #0a0e1a;
            color: #fff;
            min-height: 100vh;
        }
        .bg-orbs { position: fixed; inset: 0; z-index: -1; overflow: hidden; }
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.35;
            animation: float 20s infinite ease-in-out;
        }
        .orb1 { width: 350px; height: 350px; background: #25f4ee; top: -100px; right: -100px; }
        .orb2 { width: 300px; height: 300px; background: #fe2c55; bottom: -80px; left: -80px; animation-delay: -7s; }
        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(40px, -40px); }
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            margin-bottom: 20px;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: bold;
            text-decoration: none;
        }
        .logo-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: linear-gradient(135deg, #25f4ee, #fe2c55);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        .logo-text {
            background: linear-gradient(90deg, #25f4ee, #fe2c55);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .back-btn {
            color: #8b95a7;
            text-decoration: none;
            font-size: 14px;
            padding: 8px 15px;
            border-radius: 10px;
            background: rgba(255,255,255,0.05);
        }

        h1 {
            text-align: center;
            font-size: 26px;
            margin-bottom: 10px;
        }
        .subtitle {
            text-align: center;
            color: #8b95a7;
            font-size: 14px;
            margin-bottom: 30px;
        }

            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 18px;
            padding: 22px 20px;
            margin-bottom: 20px;
        }
        .search-box label {
            display: block;
            margin-bottom: 10px;
            font-size: 14px;
            color: #ccc;
        }
        .search-box input {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(0,0,0,0.3);
            color: white;
            font-size: 14px;
            margin-bottom: 12px;
            direction: ltr;
            text-align: left;
        }
        .search-box input:focus {
            outline: none;
            border-color: #25f4ee;
        }
