<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zak Florist — زيادة المتابعين</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Tahoma', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: white;
        }
        .topbar {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .topbar h1 {
            font-size: 20px;
            background: linear-gradient(90deg, #f39c12, #e74c3c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .topbar a {
            color: white;
            text-decoration: none;
            background: rgba(255,255,255,0.1);
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 14px;
        }
        .hero {
            padding: 25px 20px;
            text-align: center;
            background: linear-gradient(135deg, #e74c3c20, #f39c1220);
        }
        .hero h2 { font-size: 24px; margin-bottom: 8px; }
        .hero p { color: #bbb; font-size: 14px; }
        .frame-container {
            margin: 15px;
            background: white;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(231, 76, 60, 0.3);
            border: 1px solid rgba(255,255,255,0.1);
        }
        iframe {
            width: 100%;
            height: calc(100vh - 220px);
            min-height: 500px;
            border: none;
            display: block;
            background: white;
        }
        .features-bar {
            display: flex;
            justify-content: space-around;
            padding: 15px;
            background: rgba(255,255,255,0.05);
            margin: 15px;
            border-radius: 12px;
        }
        .features-bar div {
            text-align: center;
            font-size: 12px;
            color: #ccc;
        }
        .features-bar div span {
            display: block;
            font-size: 20px;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>
    <div class="topbar">
        <h1>🌸 Zak Florist</h1>
        <a href="/">← الرئيسية</a>
    </div>

    <div class="hero">
        <h2>🌸 زيادة متابعين إنستغرام</h2>
        <p>سريع • آمن • مضمون</p>
    </div>

    <div class="frame-container">
        <iframe src="{{ proxy_url }}"
                allow="clipboard-write; clipboard-read"
                sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-top-navigation allow-modals">
        </iframe>
    </div>

    <div class="features-bar">
        <div><span>⚡</span> تسليم فوري</div>
        <div><span>🔒</span> آمن</div>
        <div><span>💎</span> جودة عالية</div>
    </div>
</body>
</html>
