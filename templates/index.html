<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Djezzy 2G — زيادة المتابعين</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Tahoma', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        .logo { font-size: 60px; margin-bottom: 20px; }
        h1 { color: #333; font-size: 26px; margin-bottom: 10px; }
        p { color: #777; font-size: 15px; margin-bottom: 30px; line-height: 1.6; }
        .btn {
            display: block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 17px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        .features { margin-top: 30px; text-align: right; }
        .feature {
            display: flex;
            align-items: center;
            padding: 10px 0;
            color: #555;
            font-size: 14px;
        }
        .feature span { color: #4caf50; font-size: 20px; margin-left: 10px; }
        .footer { margin-top: 25px; font-size: 12px; color: #aaa; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">🚀</div>
        <h1>Djezzy 2G</h1>
        <p>منصتك لزيادة المتابعين والإعجابات على إنستغرام بسهولة وسرعة</p>
        <a href="/member" class="btn">ابدأ الآن</a>
        <div class="features">
            <div class="feature"><span>✓</span> متابعون حقيقيون</div>
            <div class="feature"><span>✓</span> تسليم فوري</div>
            <div class="feature"><span>✓</span> واجهة سهلة</div>
        </div>
        <div class="footer">© 2025 Djezzy 2G — جميع الحقوق محفوظة</div>
    </div>
</body>
</html>
